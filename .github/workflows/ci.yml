name: V0.1 CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
    tags: ['v1.*']
  workflow_dispatch:
    inputs:
      visual_profile:
        description: 'Development (15%) or final release (1%) visual acceptance'
        required: true
        type: choice
        default: development
        options: [development, release]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/controller
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: services/controller/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Enforce backend coverage floor
        run: |
          go tool cover -func=coverage.out | tee coverage-summary.txt
          awk '/^total:/ { found=1; if (($NF+0)<75) exit 1 } END { if (!found) exit 1 }' coverage-summary.txt
      - run: go build ./...
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-dependency-lock
          path: apps/web/package-lock.json
          retention-days: 14
  functional:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: services/controller/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install browser and dependencies
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run mock browser tests
        working-directory: apps/web
        run: npm run e2e -- --project=functional
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: functional-report
          path: apps/web/playwright-report
          retention-days: 14
  visual-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: services/controller/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install fonts and browser
        working-directory: apps/web
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Compare desktop UI with user reference
        working-directory: apps/web
        env:
          BROWSEAI_VISUAL_PROFILE: ${{ (github.ref_type == 'tag' && 'release') || inputs.visual_profile || 'development' }}
        run: npm run visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-desktop-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker compose -f deploy/compose.yml config
      - run: docker compose -f deploy/compose.yml up -d --build --wait
      - run: |
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8088/healthz
          curl --fail http://127.0.0.1:8088/api/projects | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["mock"] and len(x["projects"])==6'
          curl --fail http://127.0.0.1:8088/
      - if: always()
        run: docker compose -f deploy/compose.yml logs --no-color
      - if: always()
        run: docker compose -f deploy/compose.yml down -v
  windows-foundation:
    name: Windows foundation (Go + shared UI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: services/controller/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compile and test Windows Go controller
        working-directory: services/controller
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o "$env:RUNNER_TEMP\browseai-controller.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test Windows executable
        run: |
          $env:LISTEN_ADDR = '127.0.0.1:18080'
          $process = Start-Process -FilePath "$env:RUNNER_TEMP\browseai-controller.exe" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-RestMethod http://127.0.0.1:18080/healthz -TimeoutSec 2
                if ($response.status -eq 'ok' -and $response.mode -eq 'mock') { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Windows controller failed readiness' }
            $projects = Invoke-RestMethod http://127.0.0.1:18080/api/projects
            if (-not $projects.mock -or $projects.projects.Count -ne 6) { throw 'Unexpected project data' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Remove-Item Env:LISTEN_ADDR -ErrorAction SilentlyContinue
          }
      - name: Install shared UI dependencies
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build shared UI on Windows
        working-directory: apps/web
        run: npm run build
      - name: Install Chromium on Windows
        working-directory: apps/web
        run: npx playwright install chromium
      - name: Test shared UI on Windows
        working-directory: apps/web
        run: npm run e2e -- --project=functional
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-foundation-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
  gate:
    runs-on: ubuntu-24.04
    if: always()
    needs: [backend, web, functional, visual-desktop, compose, windows-foundation]
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; x=json.loads(os.environ["RESULTS"]); print(x); assert all(v["result"]=="success" for v in x.values())'
