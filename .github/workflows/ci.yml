name: V0.1 CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/controller
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: services/controller/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if test -f package-lock.json; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: services/controller/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install browser and dependencies
        working-directory: apps/web
        run: |
          if test -f package-lock.json; then npm ci; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium
      - name: Run mock browser tests
        working-directory: apps/web
        run: npm run e2e -- --project=functional
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: functional-report
          path: apps/web/playwright-report
          retention-days: 14
  visual-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify original reference
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          m = json.loads(pathlib.Path('design/visual-baseline.json').read_text())
          p = pathlib.Path(m['reference'])
          if not p.is_file():
              raise SystemExit('BLOCKED: original binary reference missing')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == m['sha256'], 'reference hash mismatch'
          PY
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: services/controller/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install fonts and browser
        working-directory: apps/web
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          if test -f package-lock.json; then npm ci; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium
      - name: Compare desktop UI with user reference
        working-directory: apps/web
        run: npm run visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-desktop-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker compose -f deploy/compose.yml config
      - run: docker compose -f deploy/compose.yml up -d --build --wait
      - run: |
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8088/healthz
          curl --fail http://127.0.0.1:8088/api/projects | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["mock"] and len(x["projects"])==6'
          curl --fail http://127.0.0.1:8088/
      - if: always()
        run: docker compose -f deploy/compose.yml logs --no-color
      - if: always()
        run: docker compose -f deploy/compose.yml down -v
  gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, web, functional, visual-desktop, compose]
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; x=json.loads(os.environ["RESULTS"]); print(x); assert all(v["result"]=="success" for v in x.values())'
